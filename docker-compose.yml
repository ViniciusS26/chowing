services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sistemas-distribuidos-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://backend:8000}
    depends_on:
      - backend
    networks:
      - app-network
  db:
    image: postgres:16-alpine
    container_name: chowing-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chowing_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sistemas-distribuidos-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      APP_NAME: ${APP_NAME:-chowing}
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/tasks_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on:
      - db
    networks:
      - app-network



volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
